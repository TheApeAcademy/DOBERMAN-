<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; cursor:crosshair !important; }
    body { width:280px; background:#060606; color:white; font-family:-apple-system,sans-serif; }
    .header { padding:18px 18px 14px; border-bottom:1px solid rgba(255,255,255,0.06); }
    .logo { font-size:18px; letter-spacing:0.2em; font-weight:900; font-family:monospace; }
    .status { font-size:10px; margin-top:5px; font-family:monospace; letter-spacing:0.1em; }
    .body { padding:18px; }
    .hint { font-size:12px; color:#666; line-height:1.55; margin-bottom:18px; font-family:sans-serif; }
    .cta { display:block; width:100%; padding:11px; background:white; color:black; font-weight:700; font-size:12px; border:none; border-radius:9px; text-align:center; text-decoration:none; font-family:monospace; letter-spacing:0.05em; }
    .divider { height:1px; background:rgba(255,255,255,0.06); margin:14px 0; }
    .version { font-size:10px; color:#333; text-align:center; font-family:monospace; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">DOBERMAN</div>
    <div class="status" id="status" style="color:#30D158;">Active -- Watching</div>
  </div>
  <div class="body">
    <p class="hint">
      Right-click any image, link, or selected text on any website to analyze it instantly.
    </p>
    <a href="https://doberman.vercel.app/dashboard" target="_blank" class="cta">OPEN DASHBOARD</a>
    <div class="divider"></div>
    <p class="version">DOBERMAN v1.0.0</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
